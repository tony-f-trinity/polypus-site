[package]
name = "parcelas"
version = "0.1.0"
edition = "2021"
description = "Polypus: à vista ou parcelado — compara com o dinheiro aplicado no CDI (núcleo em Rust/WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
