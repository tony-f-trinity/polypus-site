[package]
name = "receitas"
version = "0.1.0"
edition = "2021"
description = "Polypus: calculadora de custo e nutrição de receitas (núcleo em Rust/WebAssembly)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.100"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
